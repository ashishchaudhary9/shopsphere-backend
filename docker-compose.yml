services:

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - shopsphere-net

  nginx:
    image: nginx:latest
    container_name: nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - shopsphere-net

  postgres:
    image: postgres:15
    container_name: shopsphere-postgres
    environment:
      POSTGRES_DB: shopsphere_user_db
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: shopsphere123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:6
    container_name: shopsphere-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  auth-service:
    build:
      context: ./auth-service
      dockerfile: authDockerFile.yml
    container_name: auth-service
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopsphere_user_db
      SPRING_DATASOURCE_USERNAME: shopsphere
      SPRING_DATASOURCE_PASSWORD: shopsphere123

  user-service:
    build:
      context: ./user-service
      dockerfile: userDockerFile.yml
    container_name: user-service
    ports:
      - "8082:8082"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopsphere_user_db
      SPRING_DATASOURCE_USERNAME: shopsphere
      SPRING_DATASOURCE_PASSWORD: shopsphere123

  product-service:
    build:
      context: ./product-service
      dockerfile: productDockerFile.yml
    container_name: product-service
    ports:
      - "8083:8083"
    depends_on:
      - mongo
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/shopsphere_product_db

networks:
  shopsphere-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
